name: CI time

on:
  workflow_call:
    inputs:
      threshold-seconds:
        description: Seconds the working time may take beyond its baseline, and a job beyond the slowest of its earlier runs; an issue opens when a job is over this and the working time is over it too, or the run has no baseline yet
        type: number
        default: 30
      baseline-runs:
        description: Earlier successful first-attempt runs that the working time and each job are compared with
        type: number
        default: 5
      scan-limit:
        description: Newest successful runs of the same workflow and event read in one query to find those baseline runs
        type: number
        default: 25

permissions: {}

jobs:
  compare:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.run_attempt == 1
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
      checks: read
    outputs:
      body: ${{ steps.compare.outputs.body }}
    steps:
      - name: Compare the CI time of the run and of each job with earlier runs
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CREATED_AT: ${{ github.event.workflow_run.created_at }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          EVENT: ${{ github.event.workflow_run.event }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          THRESHOLD: ${{ inputs.threshold-seconds }}
          N: ${{ inputs.baseline-runs }}
          SCAN_LIMIT: ${{ inputs.scan-limit }}
        run: |
          set -euo pipefail
          timing() {
            jq -c '
              def round: . + 0.5 | floor;
              def working($span):
                reduce ($span | sort_by(.start)[]) as $v (
                  {path: {}};
                  [$span[] | select(.name != $v.name and .end <= $v.start) | . as $parent
                    | select(all($span[]; .name == $v.name or .name == $parent.name or .end <= $parent.end or .end > $v.start))] as $parents
                  | .path[$v.name] = (([$parents[].name as $up | .path[$up]] | max) // 0) + $v.work
                )
                | [.path[]] | max;
              [.jobs[] | select(.conclusion != "skipped" and .started_at != null and .completed_at != null)] as $ran
              | [$ran[] | select(.conclusion == "success")] as $ok
              | select($ok != [])
              | [$ran[] | {name,
                  start: (.started_at | fromdate),
                  end: (.completed_at | fromdate),
                  work: ((.completed_at | fromdate) - (.started_at | fromdate) | round)}] as $span
              | {number, url,
                  signature: (if $ok == $ran then [$ran[].name] | sort | join(", ") else null end),
                  wall: ((([$span[].end] | max) - (.created | fromdate)) | round),
                  secs: working($span),
                  jobs: ($ok | map({key: .name, value: {
                    secs: ((.completed_at | fromdate) - (.started_at | fromdate) | round),
                    queued: (if .created_at then ((.started_at | fromdate) - (.created_at | fromdate) | round) else null end)}}) | from_entries)}'
          }
          this=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
            | jq -c --arg created "$CREATED_AT" '{created: $created, jobs}' | timing)
          if [ -z "$this" ]; then
            echo "not comparable: no job of $URL succeeded" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          filters=(-f status=success -f event="$EVENT" -f per_page="$SCAN_LIMIT" -f exclude_pull_requests=true)
          if [ "$EVENT" != pull_request ]; then
            filters+=(-f branch="$HEAD_BRANCH")
          fi
          runs=$(gh api --method GET "repos/$GH_REPO/actions/workflows/$WORKFLOW_ID/runs" "${filters[@]}" \
            | jq -c --argjson number "$RUN_NUMBER" --arg repo "$GH_REPO" '[.workflow_runs[] | select(.run_attempt == 1 and .run_number < $number and .head_repository.full_name == $repo)
                | {number: .run_number, url: .html_url, created: .created_at, suite: .check_suite_node_id}]')
          kept=$(jq -c '{query: "query($ids: [ID!]!) { nodes(ids: $ids) { ... on CheckSuite { checkRuns(first: 100, filterBy: {checkType: ALL}) {
                nodes { name conclusion started_at: startedAt completed_at: completedAt } } } } }", variables: {ids: map(.suite)}}' <<< "$runs" \
            | gh api graphql --input - \
            | jq -c --argjson runs "$runs" '[$runs, .data.nodes] | transpose[] | .[0] + {jobs: (.[1].checkRuns.nodes | reverse | map(.conclusion |= ascii_downcase))}' \
            | timing)
          result=$(jq -s --argjson this "$this" --argjson n "$N" --argjson scanned "$(jq length <<< "$runs")" \
            --argjson threshold "$THRESHOLD" --arg name "$NAME" --arg event "$EVENT" --arg url "$URL" \
            --arg commit "${HEAD_SHA:0:7}" --arg branch "$HEAD_BRANCH" '
            def median: sort | if length % 2 == 1 then .[length / 2 | floor] else (.[length / 2 - 1] + .[length / 2]) / 2 end;
            . as $kept
            | [.[] | select($this.signature != null and .signature == $this.signature)][:$n] as $same
            | (if ($same | length) >= 3 then $same | map(.secs) | median else null end) as $base
            | ($base != null and $this.secs > $base + $threshold) as $runslow
            | [$this.jobs | to_entries[] | .key as $job | [$kept[].jobs[$job].secs | select(. != null)][:$n] as $secs
                | {$job, queued: .value.queued, this: .value.secs, runs: ($secs | length)}
                | if .runs >= 3 then .median = ($secs | median) | .slowest = ($secs | max) else . end] as $jobs
            | [$jobs[] | select(.slowest and .this > .slowest + $threshold)] as $slow
            | (if $this.signature == null then "no run baseline: a job neither succeeded nor was skipped"
               elif $base then "working time \($this.secs)s, baseline \($base)s (median working time of \($same | length) runs with the same jobs), difference \($this.secs - $base)s, of which the wall time spent waiting was \($this.wall - $this.secs)s"
               else "no run baseline yet: \($same | length) of the \($scanned) earlier runs ran the same jobs; of the wall time, \($this.wall - $this.secs)s was waiting" end) as $run
            | ([
                "\($name) (\($event)): wall \($this.wall)s, working \($this.secs)s, waiting \($this.wall - $this.secs)s, \($run), threshold \($threshold)s",
                "",
                "| job | queued (s) | this run (s) | median (s) | slowest (s) | runs |",
                "| --- | ---: | ---: | ---: | ---: | ---: |",
                ($jobs | sort_by(.slowest == null, ((.slowest // 0) - .this))[]
                  | "| \(.job) | \(.queued) | \(.this) | \(.median // "no baseline yet") | \(.slowest // "") | \(.runs) |"),
                (if $base then "", "Runs with the same jobs, working time: \($same | map("[#\(.number)](\(.url)) \(.secs)s") | join(", "))" else empty end),
                (if $runslow and $slow == [] then "", "within runner variance: the working time is over the threshold, and no job took longer than the slowest of its earlier runs by more than the threshold" else empty end)
              ] | join("\n")) as $report
            | {regressed: ($slow != [] and ($runslow or $base == null)), report: $report, body: ([
                "Run \($url) (commit \($commit), branch \($branch)) took more than the threshold of \($threshold)s longer than its earlier runs:",
                "",
                (if $runslow then "- the working time was \($this.secs)s, \($this.secs - $base)s more than the median \($base)s of the previous \($same | length) successful runs with the same jobs; the wall time was \($this.wall)s, so \($this.wall - $this.secs)s of it was waiting for a runner or a lock" else empty end),
                ($slow[] | "- job \(.job) took \(.this)s, \(.this - .slowest)s more than the slowest \(.slowest)s of the previous \(.runs) successful runs that ran it (median \(.median)s); it queued \(.queued)s before it started"),
                "",
                $report,
                "",
                "Investigate why and fix the cause. This check never blocks a merge."
              ] | join("\n"))}' <<< "$kept")
          jq -r .report <<< "$result" >> "$GITHUB_STEP_SUMMARY"
          regressed=$(jq .regressed <<< "$result")
          if [ "$regressed" != true ]; then
            exit 0
          fi
          jq -r '"body=\(.body | tojson)"' <<< "$result" >> "$GITHUB_OUTPUT"

  report:
    needs: compare
    if: needs.compare.outputs.body != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      issues: write
    concurrency:
      group: ci-time-report-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.event }}
      cancel-in-progress: false
    steps:
      - name: Open or update the CI time regression issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event.workflow_run.event }}
          BODY: ${{ needs.compare.outputs.body }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/ci-time.md"
          jq -r . <<< "$BODY" > "$body"
          title="CI time regression: $NAME ($EVENT)"
          issue=$(gh api "repos/$GH_REPO/issues?state=open&labels=ci-time&per_page=100" \
            | jq --arg title "$title" '[.[] | select((has("pull_request") | not) and .title == $title)][0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$body"
          else
            gh label create ci-time --force --color FBCA04 --description "A CI run or one of its jobs got slower than its earlier runs by more than the threshold"
            gh issue create --title "$title" --label ci-time --body-file "$body"
          fi
